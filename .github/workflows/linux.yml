# Linux 검증 잡. Windows 워크플로와 같은 모양이다.
name: Linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        run: ./gradlew check --continue --no-daemon --stacktrace

      - name: 지정 장비 릴리스 게이트 로직 테스트
        run: |
          python3 smoke-harness/test_release_gate.py
          for script in smoke-harness/run-backlog-suite.sh smoke-harness/run-release-gate.sh smoke-harness/run-initial-comparison.sh; do bash -n "$script"; done

      - name: 공개 API 단건·배치 스모크
        run: ./gradlew smokeHarness -Psmoke.args="--durability BOTH --mode BOTH --count 1000 --warmup 100 --repeat 1 --payload-bytes 256 --batch-size 100 --chunk-size 100 --max-in-flight 1000 --output build/smoke-harness/ci-smoke-report.json --work-dir build/smoke-harness/ci-smoke-work" --no-daemon --stacktrace

      - name: JVM 강제 종료 후 복구 스모크
        run: ./gradlew smokeHarness -Psmoke.args="recovery --durability BOTH --message-count 8 --lease-ms 150 --output build/smoke-harness/ci-recovery-report.json --work-dir build/smoke-harness/ci-recovery-work" --no-daemon --stacktrace

      - name: 공개 API 스모크 및 복구 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-harness-results
          path: smoke-harness/build/smoke-harness/ci-*
          if-no-files-found: ignore

      - name: PMD 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-pmd-report
          path: build/reports/pmd/*.html
          if-no-files-found: ignore

      - name: SpotBugs 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-spotbugs-report
          path: build/reports/spotbugs/main.html

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-reports
          path: build/reports/tests
          if-no-files-found: ignore

  # 배포 테스트 (a): publishToMavenLocal로 올린 아티팩트를 외부 소비자 4개가 받아 쓴다. 시크릿은 쓰지 않는다.
  linux-deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: publishToMavenLocal
        shell: bash
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: 소비자 4개 실행
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' build.gradle.kts | head -1)
          deploy-test/run-all.sh "$version"
