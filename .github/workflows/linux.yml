# Linux 검증 잡. Windows 워크플로와 같은 모양이다.
name: Linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        run: ./gradlew check --no-daemon --stacktrace

      # 무작위 하네스 스모크. check에는 들어 있지 않아 별도 단계로 돌린다. 위반이 있으면 비정상 종료한다.
      - name: ./gradlew randomBenchSmoke
        run: ./gradlew randomBenchSmoke --no-daemon --stacktrace

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-reports
          path: build/reports/tests
          if-no-files-found: ignore

      - name: 무작위 테스트 실패 파일 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-random-bench-failures
          path: build/random-bench
          if-no-files-found: ignore

  # 배포 테스트 (a): publishToMavenLocal로 올린 아티팩트를 외부 소비자 4개가 받아 쓴다. 시크릿은 쓰지 않는다.
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: publishToMavenLocal
        shell: bash
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace

      - name: 소비자 4개 실행
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)".*/\1/p' build.gradle.kts | head -1)
          deploy-test/run-all.sh "$version"
