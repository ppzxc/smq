name: Secret Scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - name: Install Gitleaks
        env:
          GOBIN: ${{ github.workspace }}/.tools/bin
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Verify scanner detection and redaction
        env:
          GITLEAKS: ${{ github.workspace }}/.tools/bin/gitleaks
        run: .github/scripts/test-secret-scan.sh

      - name: Scan pull request commits
        env:
          GITLEAKS: ${{ github.workspace }}/.tools/bin/gitleaks
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/secret-scan.sh "$BASE_SHA" "$HEAD_SHA"
