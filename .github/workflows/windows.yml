# Windows(로컬 NTFS) 검증 잡. ADR 0006: 지원 선언 전에 check 통과를 계속 확인한다.
# 성능 측정은 러너가 불안정해서 넣지 않는다. 기준선은 수동으로 잰다.
name: Windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: ./gradlew check
        shell: bash
        run: ./gradlew check --no-daemon --stacktrace

      - name: 테스트 수 요약
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(build/test-results/test/*.xml)
          echo "클래스 ${#files[@]}개"
          cat "${files[@]}" | grep -o '<testsuite [^>]*' | sed -E 's/.* tests="([0-9]+)" skipped="([0-9]+)" failures="([0-9]+)" errors="([0-9]+)".*/\1 \2 \3 \4/' \
            | awk '{t+=$1;s+=$2;f+=$3;e+=$4} END {print "테스트 " t "개: 건너뜀 " s ", 실패 " f ", 오류 " e}'

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-reports
          path: build/reports/tests
          if-no-files-found: ignore
